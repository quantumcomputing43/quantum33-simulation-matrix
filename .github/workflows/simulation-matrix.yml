name: Simulation Matrix

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Explicit project namespace"
        required: true
        default: "GENERIC_SYNTHETIC"
        type: string
  push:
    branches: [main, "github/**"]
    paths:
      - "simulation_matrix/**"
      - "tests/**"
      - ".github/workflows/simulation-matrix.yml"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: simulation-matrix-${{ github.ref }}-${{ inputs.project_id || 'GENERIC_SYNTHETIC' }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Run generic matrix
        env:
          PROJECT_ID: ${{ inputs.project_id || 'GENERIC_SYNTHETIC' }}
        run: python -m simulation_matrix.runner --project-id "$PROJECT_ID"
      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-matrix-${{ github.run_id }}-${{ inputs.project_id || 'GENERIC_SYNTHETIC' }}
          path: |
            state/
            results/
            logs/
