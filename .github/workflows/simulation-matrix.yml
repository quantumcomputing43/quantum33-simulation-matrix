name: Simulation Matrix

on:
  workflow_dispatch:

  push:
    paths:
      - "simulation_matrix/runner.py"
      - "simulation_matrix/matrix.json"
      - "simulation_matrix/__init__.py"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Simulation Matrix
        run: |
          python simulation_matrix/runner.py

      - name: Upload Matrix State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-matrix-${{ github.run_id }}
          path: |
            simulation_matrix/state/
            simulation_matrix/results/
            simulation_matrix/logs/
