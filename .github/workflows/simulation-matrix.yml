name: Simulation Matrix

on:
  workflow_dispatch:

  push:
    paths:
      - "simulation_matrix/runner.py"
      - "simulation_matrix/matrix.json"
      - "simulation_matrix/__init__.py"
      - "simulation_matrix/falsification.py"
      - "simulation_matrix/adversarial_stress.py"
      - "simulation_matrix/numerics.py"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Simulation Matrix
        run: |
          python -m simulation_matrix.runner

      - name: Run Bohmian Fisher Falsification
        run: |
          python -m simulation_matrix.falsification

      - name: Run Adversarial Stress
        run: |
          python -m simulation_matrix.adversarial_stress

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      - name: Upload Matrix State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-matrix-${{ github.run_id }}
          path: |
            simulation_matrix/state/
            simulation_matrix/results/
            simulation_matrix/logs/
