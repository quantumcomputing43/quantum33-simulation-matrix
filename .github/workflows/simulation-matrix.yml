name: Simulation Matrix

on:
  workflow_dispatch:
  push:
    branches: [main, "github/**"]
    paths:
      - "simulation_matrix/**"
      - "tests/**"
      - ".github/workflows/simulation-matrix.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Run generic matrix
        run: python -m simulation_matrix.runner
      - name: Run blind miRNA-21 five-operation calibration\n        run: python -m simulation_matrix.calibration_runner\n      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-matrix-${{ github.run_id }}
          path: |
            simulation_matrix/state/
            simulation_matrix/results/
            simulation_matrix/logs/
