name: Simulation Matrix

on:
  workflow_dispatch:
  pull_request:
  pull_request_target:
  push:
    branches: [main]
    paths:
      - "simulation_matrix/**"
      - "tests/**"
      - ".github/workflows/simulation-matrix.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all contract and matrix tests
        run: python -m unittest discover -s tests -v
      - name: Run master strategy verification
        run: python -m simulation_matrix.cases.bhd_master_verify
      - name: Run unified BHD master pre-experiment audit
        run: python -m simulation_matrix.cases.bhd_master_runner
      - name: Run generic matrix
        run: python -m simulation_matrix.runner
      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-matrix-${{ github.run_id }}
          path: |
            simulation_matrix/state/
            simulation_matrix/results/
            simulation_matrix/logs/
